name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor wl-sync also supports; 3.13 is what Fedora ships on
        # the preprocessing server. Both ends get tested because a change that
        # works on one and not the other is what this matrix exists to catch.
        #
        # Note this range is *not* constrained by PyTorch. The Pascal constraint
        # is the cu126 wheel index, which ships cp39 through cp315 — see spec
        # section 6.6, where an invented <3.12 cap is recorded and retired.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch, CPU only
        # Before the package, so the uneye extra finds it rather than resolving
        # PyPI's default CUDA build (pyproject.toml's note on PyTorch). U'n'Eye
        # runs on the CPU wherever it runs (design spec
        # 2026-10-06-uneye-design.md sections 3 and 4).
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        # wl-sync resolves from its public git URL declared in pyproject.
        run: pip install -e ".[dev,uneye]"

      - name: Fetch the NSLR reference (test-time only, AGPL-3.0, never installed)
        # Design spec 2026-09-27-nslr-design.md section 7: the authors' own
        # pure-Python NSLR and NSLR-HMM, at pinned commits, loaded by path by
        # tests/eye/detect/_nslr_reference.py. The requester approved test-only
        # use on 2026-09-27; nothing here is installed or shipped.
        run: |
          ref="$RUNNER_TEMP/nslr-ref"
          git clone -q https://gitlab.com/nslr/nslr.git "$ref/nslr"
          git -C "$ref/nslr" checkout -q 67d03f8c4a922a5a7cad9f8378caf8ba8161ee45
          git clone -q https://gitlab.com/nslr/nslr-hmm.git "$ref/nslr-hmm"
          git -C "$ref/nslr-hmm" checkout -q 3598fee3c5def6734ef6c085e44356fedafaf727
          echo "WLPP_NSLR_REFERENCE=$ref" >> "$GITHUB_ENV"

      - name: Fetch the BMD reference and its build tools (test-time only, no licence, used under its authors' permission)
        # Design spec 2026-09-27-bmd-design.md sections 2 and 7: the authors'
        # C++ at a pinned commit, patched by pattern, built and run by
        # tests/eye/detect/_bmd_reference.py. clang against libc++, because
        # the authors' stored example's random stream is libc++'s; Boost for
        # the headers bmd.cpp includes. The requester stated on 2026-09-27
        # that the authors permit its use for testing; nothing here is
        # installed or shipped. Proven 2026-09-27 in an x86-64 Ubuntu 24.04
        # container with exactly these packages.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang libc++-dev libc++abi-dev libboost-dev
          ref="$RUNNER_TEMP/bmd-ref"
          git clone -q https://github.com/basvanopheusden/BMD.git "$ref"
          git -C "$ref" checkout -q 1fab6355e57d6a7410c743ca2790d3efd502981a
          echo "WLPP_BMD_REFERENCE=$ref" >> "$GITHUB_ENV"

      - name: Assert the contracts came from wl-sync, not a local copy
        # The sync box owns session identity and the log format. If either is
        # ever vendored into this repo, there are two definitions free to drift
        # from what the hardware implements — and the drift is silent.
        run: |
          python - <<'PY'
          import wl_sync.session, wl_sync.log, wl_preproc
          for module in (wl_sync.session, wl_sync.log):
              assert "wl_preproc" not in module.__file__, (
                  f"{module.__name__} resolved inside wl_preproc: "
                  "a sync-box contract has been vendored"
              )
          print("contracts resolve from wl-sync:", wl_sync.session.__file__)
          PY

      - name: Test
        run: pytest -v

      - name: Exported schemas are current
        # docs/schemas is what wl.works and the behaviour-camera project build
        # against. A model changed without re-exporting would leave them building
        # against a contract this repo no longer implements.
        run: |
          python -m wl_preproc.cli.main schemas export --out docs/schemas
          git diff --exit-code -- docs/schemas \
            || { echo "docs/schemas is stale — run: wlpp schemas export"; exit 1; }

      - name: Guardrails
        # Section 10 states these as rules; a rule nothing enforces decays. The
        # blob check is the one that matters: under DataJoint 2.x a bare
        # longblob silently destroys array data, and only a round-trip sees it.
        run: python -m pytest tests/schema/test_guardrails.py -v
