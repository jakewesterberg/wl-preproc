schema: 1
slug: wl-preproc
class: pipeline
lifecycle: active
visibility: private
remote: https://github.com/jakewesterberg/wl-preproc.git

summary: >-
  Aligns LFP, multiunit, Kilosort output, eye tracking and task codes into one
  NWB file with DataJoint alongside; organises and compresses raw data for
  archival.

status:
  phase: >-
    Phase 1c complete; archival/compression, the eye subsystem and
    second-order calibration all merged. The saccade-detection SUBSTRATE
    (stage 1) and stage 2A are both merged. The conjunction-shape fix --
    the binocular intersection now groups both eyes' runs by kind instead
    of intersecting on time alone, so a non-saccadic label (`pso`,
    `pursuit`, `drift`) survives a conjunction instead of being crossed
    with an unrelated label -- is built and tested on branch
    `spec/conjunction-shape` (thirteen commits, tip `7680563`), MERGED as `76a8199`
    to `main`. Phase 2b's back half remains hardware-blocked.
  next: >-
    Saccade detection stage 2B — the five detectors still unwritten
    (Nyström–Holmqvist, NSLR, REMoDNaV, Bayesian microsaccade detection,
    U'n'Eye), the N-way `blended_agreement`, saccade vigor and the
    main-sequence fits, `pso`/`pursuit`/`drift` as PRODUCED rather than merely
    declared labels, the PyTorch declaration and U'n'Eye vendoring, and
    wl-expcontroller's online detector as an eighth registry entry
    (docs/handoffs/2026-09-01-consensus-and-otero-millan-built.md).

    Stage 2A is MERGED (a8fd3cb): a second detector (Otero-Millan,
    reimplemented), the coarsening lattice and comparability rule, `event_f1`
    and `cohen_kappa` with their registry, the `DetectorAgreement` table, and
    the report's agreement line. Still no `torch`; `third_party` is
    deliberately unchanged.

    The glissade-label decision that used to gate four of the five is
    WITHDRAWN, not answered
    (docs/superpowers/specs/2026-09-05-conjunction-shape-design.md, branch
    `spec/conjunction-shape`, thirteen commits `c0838b8..7680563`, MERGED to
    `main` as `76a8199` on 2026-09-05 -- 1301 passed locally on Python 3.11
    on the MERGED tree, CI on 3.11/3.13 still NOT RUN, because `main` has
    not been pushed since). The premise was wrong: a conjunction's
    label does not need to come from a detector, because when both eyes
    independently call a stretch the same KIND, their agreement on kind
    supplies the label, and a binocular glissade now stores as `pso`. What
    actually blocked the four was a defect in `_overlapping`, which
    intersected every left run against every right run on time alone and
    never read a label -- fixed by grouping both eyes' runs by kind before
    intersecting (`_conjunction_runs`). Engbert-Kliegl, Otero-Millan and
    U'n'Eye each emit one kind, so their conjunction rows are BYTE-IDENTICAL
    by the same one-kind-partition argument -- verified by an exact-tuple
    pin for engbert_kliegl alone
    (`test_engbert_kliegl_conjunction_rows_are_unchanged` in
    `tests/schema/test_detect_populate.py`), against the suite's SYNTHETIC
    stepped-session fixture, NOT the reference recording. Otero-Millan is
    registered but not separately pinned; U'n'Eye is unwritten and
    unregistered, so there is nothing of its own to pin yet. The one test
    that touches the real reference recording
    (`test_the_run_count_measured_against_the_reference_recording`) is
    env-gated and skipped by default.

    So Nyström–Holmqvist, NSLR, REMoDNaV and Bayesian microsaccade detection
    are unblocked on this question and simply unwritten, same as U'n'Eye,
    whose own obstacles remain `torch`, vendoring and a GPU instead.
    `registry.py::DETECTORS` registers only Engbert-Kliegl and Otero-Millan
    today. Five of the seven detectors specified in design spec §3.1 take
    the degenerate saccadic-slice branch and never reach `classify` -- only
    those two declare both sides of the amplitude cut.

    Two things for whoever writes the next detector
    (docs/handoffs/2026-09-05-conjunction-shape-built.md has the full
    account): a PRE-EXISTING production defect found on this branch and
    deliberately not fixed -- `schema/detect.py::register_default_paramsets`
    hardcodes a two-entry `defaults` dict and indexes it by detector name
    inside a dict comprehension over `DETECTORS`; registering a third
    detector without also extending `defaults` raises `KeyError` there,
    uncaught, in `daemon.run_once()`, aborting the ENTIRE daemon pass, not
    only that detector's registration. And the open question that matters:
    how often the two eyes disagree on KIND is unmeasured and unmeasurable
    until a pso-capable detector exists -- Nyström–Holmqvist, the simplest
    of the four, is what measures it, and that measurement should be the
    first thing stage 2B does.

    And Otero-Millan's rows are PROVISIONAL: no oracle-free statistic
    on an uncalibrated recording has been found that discriminates it, so a
    CALIBRATED SESSION is the highest-value unblock for this subsystem.

    Everything before this remains as it was: 2b-2's back half is gated on
    2b-1, the container seam, still hardware-blocked. Gap-aware segmentation
    (which validity criterion 4 is blocked on) and rehydration are the other
    hardware-free pieces outstanding.
  # 76a8199 is the merge commit that landed the thirteen conjunction-shape
  # commits (c0838b8..7680563), and is `main`'s tip. `main` also moved
  # independently during that work, to c0abc75 (a LICENSE one-liner), which
  # is why 76a8199 is a real two-parent merge rather than a fast-forward.
  #
  # This block previously named d396d85, the branch tip at the moment Task 6
  # wrote it. That was correct when written and went stale twice within the
  # hour: three more commits landed on the branch, then it merged. Recorded
  # because it is this file's own recurring failure -- a status block is only
  # true of the commit it names, and merging is exactly when it stops being.
  describes: 76a8199

runs_on: [serv]
# The pipeline is deployed to the preprocessing server, but it is written and
# tested on workstations. Its 2026-08-23 handoff records that Phase 2b's
# container seam needs Fedora with SELinux enforcing and GPU passthrough, and
# that "None of that exists or can be tested on the macOS arm64 machine this
# project is developed on." Without this field, wl-orchestrator's own manifest
# reasons about a workstation footprint that nothing declares.
builds_on: [dws, mws]

third_party:
  - name: python
    constraint: ">=3.11"
    why: >-
      3.11 is the floor wl-sync also supports; 3.13 is what Fedora ships on the
      preprocessing server. CI tests both ends.
  - name: numpy
    constraint: ">=1.26"
    why: >-
      Imported directly throughout the package -- eye/, archive/, schema/,
      timebase/, synth/, ephys/ and events/ (19 modules) -- and already a
      direct, non-transitive dependency in pyproject.toml (numpy>=1.26).
      Missing here only because this file's third_party list was never
      updated to match: two earlier task reports in this plan claimed numpy
      was already declared here, and a review repeated the error, but a
      direct grep of both files shows it was not. wlo stack reads
      third_party alone, so a workstation built from this file was missing
      software nearly every module in this package uses.
  - name: datajoint
    constraint: ">=2.3,<3"
    why: >-
      The Elements are mid-migration to DataJoint 2.x and no fork is taken.
      element-array-ephys is deliberately absent: its issue #230 is unfixed and
      its tables silently destroy array data under 2.x.
  - name: pandas
    constraint: ">=2"
    why: >-
      wl_preproc/eye/ohdpi.py imports pandas directly for read_ohdpi's
      column-selective CSV reads. It already arrives unconditionally with
      datajoint (above), a hard, non-extra requirement confirmed against
      installed distribution metadata, so a clean install already resolves
      some pandas without this entry. Declared anyway for the same reason as
      zarr below: the dependency is this package's own, and wlo stack reads
      third_party alone.

      The floor is a decision, not a formality. Task 1 closed
      OhdpiRecording's arrays against in-place mutation with an explicit
      frames.setflags(write=False) in read_ohdpi. Under the installed
      pandas 3.0.5 that call is already redundant: to_numpy() returns a
      read-only array by construction, because pandas >= 3.0 makes
      copy-on-write mandatory -- confirmed directly, not assumed: pandas
      itself raises Pandas4Warning ("Copy-on-Write can no longer be
      disabled") when asked to turn it off. A >=3 floor would make that
      guard, and the test asserting it
      (tests/eye/test_ohdpi_reader.py::test_the_arrays_reject_in_place_mutation),
      permanently unable to fail. >=2 keeps a pandas 2.x resolution valid,
      where to_numpy() returns a writeable array by default and the
      explicit call is what actually protects the frozen dataclass. No
      ceiling: datajoint requires bare pandas, unconstrained, and
      spikeinterface caps pandas<3 only under its full/metrics/docs extras,
      none of which this project installs -- both confirmed against
      installed distribution metadata.
  - name: kilosort
    where: serv
    why: >-
      Spike sorting runs on the preprocessing server. wl-stack's rig scope
      ruling of 2026-08-23 is explicit that rigs run lean, with no
      spike-sorting infrastructure at all.
  - name: spikeinterface
    constraint: ">=0.101"
    why: >-
      The format oracle for the synthetic generator: the test that matters is
      whether the reader the pipeline will actually use can open what we wrote.
  - name: zarr
    constraint: ">=2,<3"
    why: >-
      The archive is a Zarr store (2026-08-27-archival-and-compression-design
      section 1); archive/store.py calls the 2.x create_dataset(...,
      compressor=...) API directly at store.py:99 and :116-117, verified by
      reading that file, so the upper bound is load-bearing rather than
      precautionary. Not currently a fix for anything broken -- spikeinterface
      already declares zarr<3,>=2.18 as a hard dependency, confirmed against
      installed distribution metadata, so a clean install already resolves
      2.18.x without this entry. Declared anyway because the dependency is
      this package's own: store.py and verify.py import zarr directly, and
      today it arrives only because spikeinterface happens to require it. If
      spikeinterface ever drops or relaxes that pin, this repository would
      break with nothing on record saying it needed zarr at all, and wlo
      stack would build a workstation missing software this package uses.
  - name: numcodecs
    constraint: ">=0.10,<0.16"
    why: >-
      The Blosc/zstd codec archive/store.py compresses the archive with, via
      numcodecs.Blosc. Originally declared here as an unbounded >=0.15 --
      wrong on both ends, caught in review: the floor was invented rather
      than checked, and the two dependencies that already require numcodecs
      both cap it well below that. Confirmed against installed distribution
      metadata: zarr 2.18.7 (already declared above) itself requires
      numcodecs!=0.14.0,!=0.14.1,<0.16,>=0.10.0, and spikeinterface
      separately requires numcodecs<0.16.0. An unbounded floor here
      understated a real, already-enforced ceiling, which is exactly what
      this file exists to get right for wlo stack. >=0.10,<0.16 brackets
      both dependents' real constraints rather than restating zarr's own
      oddly-specific point exclusions, which this repository has no
      independent reason to assert.

# The only place this edge is written down where another repository can see it.
# The dependency itself lives in pyproject.toml, which nothing outside this
# repo reads; wl-sync had no way to learn that changing its log format breaks
# something here.
requires:
  - name: wl-sync
    pinned_at: 90b931e8d4714a0b199510d5ccb8813114bb076e
    for: session identity, the barcode codec, and the log format
    why: >-
      The sync box owns everything it produces, and vendoring copies here would
      create a second definition free to drift from the one the hardware
      actually implements. A commit pin, not a branch, because the exposure is
      wired into a CI gate rather than a test: `wlpp schemas export` re-exports
      SyncBoxLogHeader from wl-sync into docs/schemas, and CI diffs that
      directory. On a moving ref, a commit to wl-sync main would change this
      repository's exported contract with nobody here touching it. The
      dependency runs one way only — wl-sync must never import from wl-preproc,
      and CI asserts it.

publishes:
  - name: session-manifest
    kind: json-schema
    at: docs/schemas/session_manifest.json
    stability: stable
    what: >-
      One record per recording session: session_id, rig, the systems expected
      to contribute, when it started and from which source, and the
      acquisition build it ran under.

  - name: job-request
    kind: json-schema
    at: docs/schemas/job_request.json
    stability: stable
    what: >-
      A unit of work handed to the pipeline: domain, selection, parameters and
      an idempotency key. A published contract wl.works builds against, and
      its Phase 18b tests run against a fake wl-preproc that honours it.

  - name: health-response
    kind: json-schema
    at: docs/schemas/health_response.json
    stability: stable
    what: >-
      Served at the health check URL wl.works polls: a verdict, readings, and
      the host's own action list — so, in its own words, "adding a sixth job
      type needs no change on the wl.works side".

  - name: behavior-camera-sidecar
    kind: json-schema
    at: docs/schemas/behavior_camera_sidecar.json
    stability: stable
    what: >-
      Per-video metadata written beside behaviour recordings: frame count and
      rate, dropped frame ids, trigger source and digital line. A published
      contract the separate FLIR camera project builds against.

  - name: done-marker
    kind: json-schema
    at: docs/schemas/done_marker.json
    stability: stable
    what: >-
      Written when a system finishes transferring: the files it produced, the
      system that wrote them, and when the transfer finished.

  - name: syncbox-log-header
    kind: json-schema
    at: docs/schemas/syncbox_log_header.json
    stability: stable
    mirrors: wl-sync
    what: >-
      Re-exported from wl-sync, not redefined — wl-sync owns session identity
      and the log format. Kept identical by the CI step that re-runs
      `wlpp schemas export` and diffs docs/schemas.

  - name: event-code-protocol
    kind: python-model
    at: wl_preproc/contracts/events.py
    stability: stable
    what: >-
      The 16-bit strobed event code protocol: framing, escapes, checksum,
      payload word counts and DVA (degrees-of-visual-angle) encoding.
      wl-expcontroller emits against this protocol; this repository only
      decodes it. Previously the most load-bearing cross-repo contract in
      the recording path with no entry here at all — unaskable through
      `wlo`, absent from `wlo dependents`, and a change to it would notify
      nobody.

  - name: nwb-session
    kind: nwb
    stability: planned
    available_after: ingest
    what: >-
      LFP, multiunit, Kilosort output, eye tracking and task codes aligned onto
      one clock. The target layout is Phase 3 and not settled; nothing should
      be built against its structure yet.

# The artifacts this package builds on. These are the three the `requires` entry
# above names in prose — written here as the artifact names wl-sync owns, so the
# registry can join them rather than read them out of a sentence.
consumes:
  - name: syncbox-log-header
    why: >-
      Re-exported into docs/schemas and diffed by CI, so the sync box's log
      format and this repository's published contract cannot drift apart.
  - name: session-id
    why: >-
      Every session this pipeline ingests is keyed by the identity the sync box
      minted for it.
  - name: barcode-codec
    why: >-
      Alignment onto one clock is decoded from the barcodes the sync box emits.
  - name: task-event-vocabulary
    why: >-
      TaskEvent 256-4095 is ALLOCATED in wl-mllib and decoded here. Agreed
      2026-09-01, answering the clause wl-expcontroller's ADR-0007 left pending
      on this repository: ownership splits on decodability versus meaning, and a
      wrong task-event number makes a recording uninterpretable rather than
      undecodable. The four values this repository already allocated
      (TaskEvent 256-259) transfer as already-allocated -- ownership moving is
      not permission to renumber, and renumbering would silently relabel every
      event in every prior recording.

      The enum still lives in wl_preproc/contracts/events.py because wl-mllib
      publishes this artifact as `stability: planned` and defines no TaskEvent
      in code, so ours is the only implementation and this pipeline must decode
      those values today. It is a MIRROR of wl-mllib's allocation, not the
      source of truth, on the same reasoning wl-expcontroller mirrors
      PAYLOAD_WORD_COUNTS rather than importing it. New task events are
      requested there and never added here. When wl-mllib ships a package this
      becomes a `requires` edge with a commit pin, the way wl-sync already is.
