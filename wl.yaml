slug: wl-preproc
class: pipeline
lifecycle: active
visibility: private
remote: https://github.com/jakewesterberg/wl-preproc.git

summary: >-
  Aligns LFP, multiunit, Kilosort output, eye tracking and task codes into one
  NWB file with DataJoint alongside; organises and compresses raw data for
  archival.

status:
  phase: >-
    Phase 3 (NWB export) is in progress, and every piece that does not need
    spike sorting is merged on main (6f5ddbe, 2026-10-05): the builder,
    publishing to the NAS shares and the canonical lifecycle (pieces 1, 2a and
    2b); probes and areas in the file; runs and trials from wl-xcon's codes; the
    landed-session listing, GET /sessions; requests that name runs, with the NWB
    description at version 3; and subject corrections in files already built.
    With them, everything wl.works asked of this repository for January's
    canonical NWBs is built. Earlier phases are complete: ingest and the
    timebase (1c), archival with rehydration, and the eye subsystem with
    calibration and seven saccade detectors (U'n'Eye, the seventh, merged
    5b41770, 2026-10-07), with their saccades' main sequence and vigor
    (ff8aeb9, 2026-10-08) and their seven-way agreement (3a45a09,
    2026-10-10). Spike sorting (Phase 2b, and the
    NWB's units) waits on the compute machine. docs/CHECKPOINT.md and
    docs/handoffs/ hold the full record. *Until 2026-10-05 this field was a
    running log of every merge since Phase 1c; it is in git at 817c204:wl.yaml;
    true when written.*
  next: >-
