schema: 1
slug: wl-preproc
class: pipeline
lifecycle: active
visibility: private
remote: https://github.com/jakewesterberg/wl-preproc.git

summary: >-
  Aligns LFP, multiunit, Kilosort output, eye tracking and task codes into one
  NWB file with DataJoint alongside; organises and compresses raw data for
  archival.

status:
  phase: >-
    Phase 1c complete; archival/compression, the eye subsystem and
    second-order calibration all merged. The saccade-detection SUBSTRATE
    (stage 1) and stage 2A are both merged. The conjunction-shape fix --
    the binocular intersection now groups both eyes' runs by kind instead
    of intersecting on time alone, so a non-saccadic label (`pso`,
    `pursuit`, `drift`) survives a conjunction instead of being crossed
    with an unrelated label -- MERGED as `76a8199` to `main`, thirteen
    commits `c0838b8..7680563`. A follow-up fix on `main`
    (`fix/detector-carries-its-defaults`, merged `19daf07`) made a
    `Detector` carry its own paramset defaults instead of a hardcoded
    two-entry dict, so a third detector can register without crashing
    `daemon.run_once()`.

    Stage 2B's first detector, Nystrom-Holmqvist, is written, tested,
    registered and MERGED -- the third registered detector, and the first
    to emit `pso` and `fixation` -- as `534e8b5`, sixteen commits
    `19daf07..2f93374`, with a whole-branch review's own fix wave in
    `84247d1`. Two measurement rounds have landed on top of it: the three
    `WLPP_OHDPI_REFERENCE`-gated reference checks and the eye
    kind-disagreement statistic (`1dc1676`), and a DataJoint 2.3.3 pin move
    (`ea08678`) after that merge turned `main` red in a test unrelated to
    it. `origin`'s `main` is at `d30cbc6` today; the last commit CI was read
    off is `30d4761`, green on 3.11 and 3.13, and the two docs commits since
    (`dee5073`, `d30cbc6`) have not been re-read off a run here. Phase 2b's
    back half remains hardware-blocked.

    Gap-aware barcode extraction is BUILT and MERGED as `f5fb642` (24
    commits `d30cbc6..5a80156`, the spec commit `66e9cf2` first), with CI
    GREEN on both interpreters -- `gh run view 35466730194` reports
    `test (3.11): success` and `test (3.13): success`. This block said "NOT
    merged ... 22 commits ... CI has never run on it" while that was true;
    a whole-branch review then found a Critical defect and its fix added two
    commits. `extract_ohdpi`
    no longer refuses a recording with a dropped frame: it rebuilds the
    trace at true length from the file's own frame-number column and
    discards only the barcode words a gap falls inside. `Segment` gains
    `n_frame_gaps`, `n_frames_missing` and `n_barcodes_dropped`; a file the
    gaps left with no barcode is rejected as `gap_corrupted`; and validity
    criterion 4 fires end to end for the first time. 26 new tests; 1394
    passed on 3.11 and 1393 on 3.13 against a freshly compiled resolution,
    verified before any merge rather than after. No published contract
    changed: `Segment` is a DataJoint table and appears in none of the six
    JSON schemas under `docs/schemas`, which the design spec itself first
    claimed the other way and corrects in place.

    *The three sentences above replaced ones reading "NOT merged, NOT
    pushed: `origin` has no `spec/nystrom-holmqvist` ref" and "`origin`'s
    `main` is at `19daf07` today". Both were true when written and had been
    false since 2026-09-06 and 2026-09-13 respectively. `next` below had
    already recorded its own version of this same staleness; this block was
    left behind by that correction, which is the fifth instance of this
    repository's recurring lesson that a status sentence is only true of the
    commit it names.*
  next: >-
    **Hardware status as of 2026-09-19, stated by the requester at session
    close: the rig is NOT ready and the compute machine is NOT assembled.**
    The next session is hardware-free code development; ask whether that has
    changed before planning around it. Recommended order, with the reasoning
    in `docs/CHECKPOINT.md`'s own "Start here next session" header:
    (1) REHYDRATION is BUILT on `spec/rehydration` (2026-09-26, not merged as
    written): `wlpp rehydrate` restores a reclaimed session byte for byte, and
    `wlpp reclaim --no-dry-run` deletes, run by a person, behind a proof
    against the NAS copy. A sixth condition, the canonical NWB, fails until
    Phase 3, so every real reclamation needs a recorded force until then. A
    session forced out before all its stages have populated makes the event
    stage error every pass, and any later-registered stage error once, until
    rehydrated and the job error is cleared by hand -- whether the daemon
    should instead skip a currently-freed session is an OPEN DECISION for
    the requester, not settled on this branch. Its spec names what is next
    in this line: the archive writer still reads each file whole into
    memory and a two-hour Neuropixels AP file is ~166 GB, so a STREAMING
    WRITER is due before January; (2) the three remaining
    hardware-free detectors, NSLR, REMoDNaV (the detector, not the PyPI test
    oracle) and Bayesian microsaccade detection, which matter here as SACCADE
    detectors because the requester has said glissades are peripheral;
    (3) moving `_KIND_OF` out of `schema/detect.py` into
    `eye/detect/labels.py`, a duplicate with four consumers and nothing able
    to catch it drifting; (4) measuring which of the 225/337 unmatched
    saccades are real.

    Two items are BLOCKED on hardware and should be raised again when it
    exists. The barcode and timebase alignment path has never been exercised
    against real data and cannot be with the recording this lab has -- a few
    minutes of recording on the real rig with the sync box live would
    validate the whole timebase chain before January, and it is not a code
    task. And all of Phase 2b waits on the compute machine; if that is
    assembled, it outranks every hardware-free item above.

    The mechanism behind the glissade cost is measured as of 2026-09-19
    (MERGED as `eb5a979`, CI green on both interpreters, read off run
    35444119197): the two
    eyes place a saccade's offset a median 10.03 ms apart over disagreeing
    glissades against 6.02 ms on saccades they agree about -- about 1.7x
    ordinary boundary jitter, NOT the one-glissade-duration displacement
    that was hypothesised. What costs the glissades is that they are SHORT
    (median 14-16 ms), so ordinary jitter lands inside them. No detector
    change removes this; the lever is the binocular agreement rule itself,
    which makes it a design question. A quarter to a third of the
    disagreements are a separate defect -- the other eye carrying a much
    longer saccade over the whole event. See
    `docs/handoffs/2026-09-19-the-glissade-is-short-not-the-eyes-disagreeing.md`.

    The measurement that produced the finding it explains was MERGED as
    `b996447` with CI green on both interpreters (read off run
    35442225561): conjunction-shape spec section 6
    asked WHICH kinds the two eyes disagree about, and it is `pso` against
    `saccadic` in essentially every case (721 of 721 and 855 of 855), but
    almost entirely in ONE direction -- one eye calling a stretch a glissade
    while the other still calls it a saccade, at about twice its chance
    share, with the mirror depleted to a thirtieth of chance. Restated as
    cost, the binocular agreement rule discards 53.6-56.8% of every detected
    glissade and 4.6-6.9% of saccades -- CORRECTED 2026-09-19 from "35-39%"
    and "0.2-0.4%", which counted only kind disagreements and not the
    `alone` bucket the same rule drops; for saccades essentially the whole
    cost is 225 and 337 events one eye detected and the other did not detect
    at all, which is the only part of it that reaches a consumer with no
    interest in glissades. So the "about a fifth" recorded on
    2026-09-12 is an average over two kinds that are not affected alike.
    `docs/handoffs/2026-09-19-which-kinds-disagree.md` has the account. The
    next measurement is the saccade-offset difference between the eyes over
    those events, which settles whether the mechanism is boundary placement.

    Saccade detection stage 2B has its first detector: Nystrom-Holmqvist
    is written, tested and registered -- the third registered detector,
    and the first ever to emit `pso` and `fixation` -- on branch
    `spec/nystrom-holmqvist` (eleven commits `6e952f6..a78dcf0`), NOT
    merged and NOT pushed (`origin` has no `spec/nystrom-holmqvist` ref).
    `docs/handoffs/2026-09-05-nystrom-holmqvist-built.md` has the full
    account. Four detectors remain unwritten -- NSLR, REMoDNaV (the
    detector; the `remodnav` PyPI package is a separate, `dev`-only test
    oracle -- see `third_party` below), Bayesian microsaccade detection,
    U'n'Eye -- plus the N-way `blended_agreement`, saccade vigor and the
    main-sequence fits, `pursuit`/`drift` as PRODUCED labels (`pso` now
    IS produced), the PyTorch declaration and U'n'Eye vendoring, and
    wl-expcontroller's online detector as an eighth registry entry
    (docs/handoffs/2026-09-01-consensus-and-otero-millan-built.md).
    That checklist is DONE, and this field said "none of this is done
    yet" until 2026-09-13 -- a week after the branch merged as 534e8b5
    with CI green on both interpreters. The whole-branch review happened
    (six Important, six Minor, one fix wave, a scoped re-review), the
    constants were confirmed against Table 2, and the commit 5969c60
    corrected the sibling claims in CHECKPOINT and the handoff while
    leaving these two behind.

    Stage 2A is MERGED (a8fd3cb): a second detector (Otero-Millan,
    reimplemented), the coarsening lattice and comparability rule, `event_f1`
    and `cohen_kappa` with their registry, the `DetectorAgreement` table, and
    the report's agreement line. Still no `torch`; `third_party` is
    deliberately unchanged.

    The glissade-label decision that used to gate four of the five is
    WITHDRAWN, not answered
    (docs/superpowers/specs/2026-09-05-conjunction-shape-design.md, branch
    `spec/conjunction-shape`, thirteen commits `c0838b8..7680563`, MERGED to
    `main` as `76a8199` on 2026-09-05 -- 1301 passed locally on Python 3.11
    on the MERGED tree; CI green on 3.11 and 3.13, read off the run). The premise was wrong: a conjunction's
    label does not need to come from a detector, because when both eyes
    independently call a stretch the same KIND, their agreement on kind
    supplies the label, and a binocular glissade now stores as `pso`. What
    actually blocked the four was a defect in `_overlapping`, which
    intersected every left run against every right run on time alone and
    never read a label -- fixed by grouping both eyes' runs by kind before
    intersecting (`_conjunction_runs`). Engbert-Kliegl, Otero-Millan and
    U'n'Eye each emit one kind, so their conjunction rows are BYTE-IDENTICAL
    by the same one-kind-partition argument -- verified by an exact-tuple
    pin for engbert_kliegl alone
    (`test_engbert_kliegl_conjunction_rows_are_unchanged` in
    `tests/schema/test_detect_populate.py`), against the suite's SYNTHETIC
    stepped-session fixture, NOT the reference recording. Otero-Millan is
    registered but not separately pinned; U'n'Eye is unwritten and
    unregistered, so there is nothing of its own to pin yet. The one test
    that touches the real reference recording
    (`test_the_run_count_measured_against_the_reference_recording`) is
    env-gated and skipped by default.

    NSLR, REMoDNaV and Bayesian microsaccade detection are still simply
    unwritten, same as U'n'Eye, whose own obstacles remain `torch`,
    vendoring and a GPU instead. `registry.py::DETECTORS` registers
    THREE today -- Engbert-Kliegl, Otero-Millan, Nystrom-Holmqvist,
    corrected from the "only Engbert-Kliegl and Otero-Millan" this
    field said before. Five of the seven detectors specified in design
    spec §3.1 take the degenerate saccadic-slice branch and never reach
    `classify` -- only Engbert-Kliegl and Otero-Millan declare both
    sides of the amplitude cut; Nystrom-Holmqvist is now one of the five
    degenerate ones for real, not hypothetically.

    Two corrections to what this field said before Nystrom-Holmqvist
    existed (docs/handoffs/2026-09-05-nystrom-holmqvist-built.md has the
    full account). First, the "PRE-EXISTING production defect ...
    deliberately not fixed" -- `register_default_paramsets` hardcoding a
    two-entry `defaults` dict and raising `KeyError` on a third detector
    -- IS FIXED, on `main`, before this branch's own first commit
    (`fix/detector-carries-its-defaults`, merged `19daf07`; `Detector`
    now carries its own required `defaults` field). Nystrom-Holmqvist
    registered without incident. Second, the open question called
    "unmeasured and unmeasurable until a pso-capable detector exists" is
    now MEASURED -- 2026-09-12, and this field said "STILL unmeasured"
    until that day. How often the two eyes disagree about an event's
    KIND, from the PER-EYE traces as design spec
    `2026-09-05-nystrom-holmqvist-design.md` section 6 requires: 0.1112
    (left->right) and 0.1286 (right->left), against a random control's
    0.376-0.470, so the eyes agree about three and a half times better
    than chance and the check discriminates. The binocular agreement
    requirement drops 18.6% / 21.5% of each eye's detected events -- the
    "conservative or costly" question answered at about a fifth. In both
    directions the eyes more often disagree about WHAT happened (721,
    855 runs) than one eye misses an event entirely (595, 733); which
    kind pairs disagree is not yet measured.

    Nystrom-Holmqvist's own null ran first, per the rule the
    Otero-Millan round left behind: a duration-matched random-span
    control scores 0.016 (seed 7; 0.008-0.030 across seeds 0-19)
    against a 0.10 ceiling and the paper's own 47.8% -- far under it, so
    the glissade-rate check discriminates and is RETAINED, the opposite
    outcome from Otero-Millan's withdrawn one. The three checks that need the
    real reference recording -- glissade rate, glissade duration, the
    REMoDNaV oracle comparison -- RAN for the first time on 2026-09-12,
    and this field said "have never run" until that day. All three pass.
    Glissade rate 0.399 (left) / 0.416 (right) against the paper's 0.478
    reading; glissade duration 18.4 +/- 10.8 ms / 19.5 +/- 10.5 ms
    against the paper's 22.2 +/- 9.8 ms. So the paper's numbers are no
    longer predictions, and the shared five-point velocity differentiator
    does NOT smooth glissades away -- design spec section 9 item 1,
    answered. Both measurements land below the paper in the same
    direction, consistent with mild truncation by that smoother; both sit
    inside the paper's own sd, and the tutorial recording's task is
    neither reading nor scene perception.

    REMoDNaV's integration is verified end to end: `remodnav==1.1.2`
    installed with `uv pip install --python .venv/bin/python`, which
    works despite this `.venv` having no `pip` -- a claim this field
    previously made the other way. The oracle agrees within 1% (571 vs
    574 saccades left, 570 vs 565 right) on a check that tolerates a
    factor of two.

    Registering a third detector broke 19 pre-existing tests that
    hardcoded "exactly 2 detectors / 1 pair", fixed by deriving counts
    from the registry rather than a new literal.
    `tests/cli/test_consensus_report.py`'s own isolation strategy (a
    vocabulary string "no REGISTERED pair can produce") is still
    order-sensitive and collided once already; a fourth detector may
    collide again.

    And Otero-Millan's rows are PROVISIONAL: no oracle-free statistic
    on an uncalibrated recording has been found that discriminates it, so a
    CALIBRATED SESSION is the highest-value unblock for this subsystem.

    THE LARGEST OPEN FINDING IS NOT A DEFECT IN ANY OF THIS. The lab's only
    real recording carries no wl-sync barcodes at all, so the barcode and
    timebase alignment path has never been exercised against real data, and
    cannot be with the recording this lab currently has. Measured 2026-09-19
    off `OpenIris-2024Jul31-114628.txt`'s own Int0 line (1,177,799 rows,
    498.55 Hz from its own timestamps, zero frame gaps): 5,789 transitions,
    2,894 complete HIGH pulses of a consistent 124.4-126.4 ms separated by
    irregular LOW runs of 124.4 ms to 1,251.6 ms, repeating at about 1.2 Hz.
    Its shortest complete feature is 124.4 ms, nearly twenty-five times a
    5 ms BIT_SLOT_US, so no arrangement of those edges can express a 32-bit
    word in a 200 ms frame, and `decode_edges` recovers zero barcodes from
    it. It is OpenIrisDPI's own tutorial recording, not a session from this
    lab's synced rig. Every barcode test here therefore runs on synthetic
    fixtures. The unblock is a session recorded on the synced rig with the
    sync box driving the ohDPI digital line -- the same hardware unblock a
    calibrated session would be for Otero-Millan's provisional rows.

    Everything before this remains as it was: 2b-2's back half is gated on
    2b-1, the container seam, still hardware-blocked. Gap-aware barcode
    extraction (which validity criterion 4 was blocked on) is now BUILT on
    an unmerged branch -- see `phase` above -- which left rehydration as
    the only hardware-free piece outstanding; that is now built too
    (2026-09-26).

    **The whole-branch review ran, and its fix wave is `84247d1`.** Eight
    mutation-testing gaps in the adaptive offset threshold (seven new tests
    in `tests/eye/detect/test_nystrom_holmqvist.py`, each mutation verified
    caught by literal source mutation and revert), the missing test that
    the real detector's own conjunction ever stores a `pso`
    (`test_a_real_saccade_and_glissade_produce_a_binocular_pso_conjunction_
    run` in `tests/schema/test_detect_populate.py`, on a new fixture with a
    genuine binocular post-saccadic wobble), the stale `detect()` signature
    in the parent spec, and every stale or false claim named above in this
    field -- the "installed" REMoDNaV wording, the 9/1/9 test-break split,
    the register_default_paramsets/kind-disagreement paragraph this file
    itself carried uncorrected -- are all closed. 1341 passed (1333 plus
    the eight new tests), 8 skipped, 1 deselected, 1 xfailed, zero warnings.
    Pushed and CI-green since 534e8b5 (gh run view 34014528809, both
    interpreters); "still not pushed" was true when written and false
    within the hour, and stayed in this file for a week after.
