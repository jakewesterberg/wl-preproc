schema: 1
slug: wl-preproc
class: pipeline
lifecycle: active
visibility: private
remote: https://github.com/jakewesterberg/wl-preproc.git

summary: >-
  Aligns LFP, multiunit, Kilosort output, eye tracking and task codes into one
  NWB file with DataJoint alongside; organises and compresses raw data for
  archival.

status:
  phase: >-
    Phase 1c complete; archival/compression, the eye subsystem and
    second-order calibration all merged. The saccade-detection SUBSTRATE
    (stage 1) and stage 2A are both merged. The conjunction-shape fix --
    the binocular intersection now groups both eyes' runs by kind instead
    of intersecting on time alone, so a non-saccadic label (`pso`,
    `pursuit`, `drift`) survives a conjunction instead of being crossed
    with an unrelated label -- MERGED as `76a8199` to `main`, thirteen
    commits `c0838b8..7680563`. A follow-up fix on `main`
    (`fix/detector-carries-its-defaults`, merged `19daf07`) made a
    `Detector` carry its own paramset defaults instead of a hardcoded
    two-entry dict, so a third detector can register without crashing
    `daemon.run_once()`. `origin`'s `main` is at `19daf07` today.

    Stage 2B's first detector, Nystrom-Holmqvist, is written, tested and
    registered -- the third registered detector, and the first to emit
    `pso` and `fixation` -- eleven commits `6e952f6..a78dcf0` on branch
    `spec/nystrom-holmqvist`, based on `main` at `19daf07`, with a
    whole-branch review's own fix wave on top (`84247d1` -- see `next`
    below). NOT merged, NOT pushed: `origin` has no `spec/nystrom-holmqvist`
    ref. Phase 2b's back half remains hardware-blocked.
  next: >-
    Saccade detection stage 2B has its first detector: Nystrom-Holmqvist
    is written, tested and registered -- the third registered detector,
    and the first ever to emit `pso` and `fixation` -- on branch
    `spec/nystrom-holmqvist` (eleven commits `6e952f6..a78dcf0`), NOT
    merged and NOT pushed (`origin` has no `spec/nystrom-holmqvist` ref).
    `docs/handoffs/2026-09-05-nystrom-holmqvist-built.md` has the full
    account. Four detectors remain unwritten -- NSLR, REMoDNaV (the
    detector; the `remodnav` PyPI package is a separate, `dev`-only test
    oracle -- see `third_party` below), Bayesian microsaccade detection,
    U'n'Eye -- plus the N-way `blended_agreement`, saccade vigor and the
    main-sequence fits, `pursuit`/`drift` as PRODUCED labels (`pso` now
    IS produced), the PyTorch declaration and U'n'Eye vendoring, and
    wl-expcontroller's online detector as an eighth registry entry
    (docs/handoffs/2026-09-01-consensus-and-otero-millan-built.md).
    Before this branch is a PR: a whole-branch review, push and read CI
    on both interpreters, and confirm every params-dataclass constant
    traces to the paper's Table 2 -- none of this is done yet.

    Stage 2A is MERGED (a8fd3cb): a second detector (Otero-Millan,
    reimplemented), the coarsening lattice and comparability rule, `event_f1`
    and `cohen_kappa` with their registry, the `DetectorAgreement` table, and
    the report's agreement line. Still no `torch`; `third_party` is
    deliberately unchanged.

    The glissade-label decision that used to gate four of the five is
    WITHDRAWN, not answered
    (docs/superpowers/specs/2026-09-05-conjunction-shape-design.md, branch
    `spec/conjunction-shape`, thirteen commits `c0838b8..7680563`, MERGED to
    `main` as `76a8199` on 2026-09-05 -- 1301 passed locally on Python 3.11
    on the MERGED tree; CI green on 3.11 and 3.13, read off the run). The premise was wrong: a conjunction's
    label does not need to come from a detector, because when both eyes
    independently call a stretch the same KIND, their agreement on kind
    supplies the label, and a binocular glissade now stores as `pso`. What
    actually blocked the four was a defect in `_overlapping`, which
    intersected every left run against every right run on time alone and
    never read a label -- fixed by grouping both eyes' runs by kind before
    intersecting (`_conjunction_runs`). Engbert-Kliegl, Otero-Millan and
    U'n'Eye each emit one kind, so their conjunction rows are BYTE-IDENTICAL
    by the same one-kind-partition argument -- verified by an exact-tuple
    pin for engbert_kliegl alone
    (`test_engbert_kliegl_conjunction_rows_are_unchanged` in
    `tests/schema/test_detect_populate.py`), against the suite's SYNTHETIC
    stepped-session fixture, NOT the reference recording. Otero-Millan is
    registered but not separately pinned; U'n'Eye is unwritten and
    unregistered, so there is nothing of its own to pin yet. The one test
    that touches the real reference recording
    (`test_the_run_count_measured_against_the_reference_recording`) is
    env-gated and skipped by default.

    NSLR, REMoDNaV and Bayesian microsaccade detection are still simply
    unwritten, same as U'n'Eye, whose own obstacles remain `torch`,
    vendoring and a GPU instead. `registry.py::DETECTORS` registers
    THREE today -- Engbert-Kliegl, Otero-Millan, Nystrom-Holmqvist,
    corrected from the "only Engbert-Kliegl and Otero-Millan" this
    field said before. Five of the seven detectors specified in design
    spec §3.1 take the degenerate saccadic-slice branch and never reach
    `classify` -- only Engbert-Kliegl and Otero-Millan declare both
    sides of the amplitude cut; Nystrom-Holmqvist is now one of the five
    degenerate ones for real, not hypothetically.

    Two corrections to what this field said before Nystrom-Holmqvist
    existed (docs/handoffs/2026-09-05-nystrom-holmqvist-built.md has the
    full account). First, the "PRE-EXISTING production defect ...
    deliberately not fixed" -- `register_default_paramsets` hardcoding a
    two-entry `defaults` dict and raising `KeyError` on a third detector
    -- IS FIXED, on `main`, before this branch's own first commit
    (`fix/detector-carries-its-defaults`, merged `19daf07`; `Detector`
    now carries its own required `defaults` field). Nystrom-Holmqvist
    registered without incident. Second, the open question called
    "unmeasured and unmeasurable until a pso-capable detector exists" is
    now measurable and STILL unmeasured -- Nystrom-Holmqvist is that
    detector, and measuring how often the two eyes disagree on an
    event's KIND is stage 2B's highest remaining priority. It MUST run
    against the PER-EYE traces, never the conjunction: when the eyes
    disagree, no intersection covers those samples, so
    `_insert_trace`'s fill paints them `fixation`, identical to genuine
    binocular fixation, and a query against the conjunction would
    silently report zero (design spec
    `2026-09-05-nystrom-holmqvist-design.md` section 6).

    Nystrom-Holmqvist's own null ran first, per the rule the
    Otero-Millan round left behind: a duration-matched random-span
    control scores 0.016 (seed 7; 0.008-0.030 across seeds 0-19)
    against a 0.10 ceiling and the paper's own 47.8% -- far under it, so
    the glissade-rate check discriminates and is RETAINED, the opposite
    outcome from Otero-Millan's withdrawn one. The checks that need the
    real reference recording -- glissade rate, glissade duration, the
    REMoDNaV oracle comparison -- are gated on `WLPP_OHDPI_REFERENCE`
    and have never run; the paper's 47.8% / 22.2 ms remain predictions,
    not measurements. REMoDNaV's own integration is unverified end to
    end: its API was read from a downloaded wheel, not an installed
    package -- remodnav is not installed anywhere this repository's
    tooling has checked -- and this `.venv` has no `pip`, so the test has
    never executed.

    Registering a third detector broke 19 pre-existing tests that
    hardcoded "exactly 2 detectors / 1 pair", fixed by deriving counts
    from the registry rather than a new literal.
    `tests/cli/test_consensus_report.py`'s own isolation strategy (a
    vocabulary string "no REGISTERED pair can produce") is still
    order-sensitive and collided once already; a fourth detector may
    collide again.

    And Otero-Millan's rows are PROVISIONAL: no oracle-free statistic
    on an uncalibrated recording has been found that discriminates it, so a
    CALIBRATED SESSION is the highest-value unblock for this subsystem.

    Everything before this remains as it was: 2b-2's back half is gated on
    2b-1, the container seam, still hardware-blocked. Gap-aware segmentation
    (which validity criterion 4 is blocked on) and rehydration are the other
    hardware-free pieces outstanding.

    **The whole-branch review ran, and its fix wave is `84247d1`.** Eight
    mutation-testing gaps in the adaptive offset threshold (seven new tests
    in `tests/eye/detect/test_nystrom_holmqvist.py`, each mutation verified
    caught by literal source mutation and revert), the missing test that
    the real detector's own conjunction ever stores a `pso`
    (`test_a_real_saccade_and_glissade_produce_a_binocular_pso_conjunction_
    run` in `tests/schema/test_detect_populate.py`, on a new fixture with a
    genuine binocular post-saccadic wobble), the stale `detect()` signature
    in the parent spec, and every stale or false claim named above in this
    field -- the "installed" REMoDNaV wording, the 9/1/9 test-break split,
    the register_default_paramsets/kind-disagreement paragraph this file
    itself carried uncorrected -- are all closed. 1341 passed (1333 plus
    the eight new tests), 8 skipped, 1 deselected, 1 xfailed, zero warnings.
    Still not pushed; a whole-branch review is no longer on the "before
    opening a PR" checklist, but pushing and reading CI off the run still
    are.
