runs_on: [serv]
# The pipeline is deployed to the preprocessing server, but it is written and
# tested on workstations. Its 2026-08-23 handoff records that Phase 2b's
# container seam needs Fedora with SELinux enforcing and GPU passthrough, and
# that "None of that exists or can be tested on the macOS arm64 machine this
# project is developed on." Without this field, wl-orchestrator's own manifest
# reasons about a workstation footprint that nothing declares.
builds_on: [dws, mws]

third_party:
  - name: python
    constraint: ">=3.11"
    why: >-
      3.11 is the floor wl-sync also supports; 3.13 is what Fedora ships on the
      preprocessing server. CI tests both ends.
  - name: numpy
    constraint: ">=1.26"
    why: >-
      Imported directly throughout the package -- eye/, archive/, schema/,
      timebase/, synth/, ephys/ and events/ (19 modules) -- and already a
      direct, non-transitive dependency in pyproject.toml (numpy>=1.26).
      Missing here only because this file's third_party list was never
      updated to match: two earlier task reports in this plan claimed numpy
      was already declared here, and a review repeated the error, but a
      direct grep of both files shows it was not. wlo stack reads
      third_party alone, so a workstation built from this file was missing
      software nearly every module in this package uses. Capped below 2.6
      wherever numba is installed, which is everywhere this package is
      (numba below): numba 0.67 declares numpy<2.6,>=1.22, so a numpy
      release past 2.5 waits on a numba release that admits it. The ceiling
      is numba's, and this constraint does not restate it.
  - name: scipy
    constraint: ">=1.17"
    why: >-
      eye/detect/remodnav.py calls scipy.ndimage.median_filter,
      scipy.signal.butter and scipy.signal.filtfilt(method='gust') -- the
      functions REMoDNaV's own implementation calls for its candidate speed
      and its 4 Hz pursuit low-pass (design spec
      2026-09-26-remodnav-design.md section 7). Reimplementing Gustafsson's
      initial conditions would be one more reimplementation to validate.
      The floor is 1.17 because 1.17.1 is the oldest release the fidelity
      check (spec section 5.1) has run against; nothing older is tested.
  - name: numba
    constraint: ">=0.67"
    why: >-
      eye/detect/nslr.py compiles NSLR's segmentation loop with numba.njit
      (no fastmath) -- the requester's choice on 2026-09-27 after plain
      Python measured about 25 minutes per eye for a two-hour session (design
      spec 2026-09-27-nslr-design.md section 4.1, section 7). Brings
      llvmlite. The floor 0.67.0 is the version the design's prototype ran
      on (Python 3.11 with numpy 2.4.6; 3.13 with numpy 2.5.3). numba
      declares numpy<2.6, so this pipeline's numpy is capped wherever numba
      is; a numpy release beyond that waits on numba.
  - name: datajoint
    constraint: ">=2.3,<3"
    why: >-
      The Elements are mid-migration to DataJoint 2.x and no fork is taken.
      element-array-ephys is deliberately absent: its issue #230 is unfixed and
      its tables silently destroy array data under 2.x.
  - name: pandas
    constraint: ">=2"
    why: >-
      wl_preproc/eye/ohdpi.py imports pandas directly for read_ohdpi's
      column-selective CSV reads. It already arrives unconditionally with
      datajoint (above), a hard, non-extra requirement confirmed against
      installed distribution metadata, so a clean install already resolves
      some pandas without this entry. Declared anyway for the same reason as
      zarr below: the dependency is this package's own, and wlo stack reads
      third_party alone.

      The floor is a decision, not a formality. Task 1 closed
      OhdpiRecording's arrays against in-place mutation with an explicit
      frames.setflags(write=False) in read_ohdpi. Under the installed
      pandas 3.0.5 that call is already redundant: to_numpy() returns a
      read-only array by construction, because pandas >= 3.0 makes
      copy-on-write mandatory -- confirmed directly, not assumed: pandas
      itself raises Pandas4Warning ("Copy-on-Write can no longer be
      disabled") when asked to turn it off. A >=3 floor would make that
      guard, and the test asserting it
      (tests/eye/test_ohdpi_reader.py::test_the_arrays_reject_in_place_mutation),
      permanently unable to fail. >=2 keeps a pandas 2.x resolution valid,
      where to_numpy() returns a writeable array by default and the
      explicit call is what actually protects the frozen dataclass. No
      ceiling: datajoint requires bare pandas, unconstrained, and
      spikeinterface caps pandas<3 only under its full/metrics/docs extras,
      none of which this project installs -- both confirmed against
      installed distribution metadata.
  - name: kilosort
    where: serv
    why: >-
      Spike sorting runs on the preprocessing server. wl-stack's rig scope
      ruling of 2026-08-23 is explicit that rigs run lean, with no
      spike-sorting infrastructure at all.
  - name: spikeinterface
    constraint: ">=0.101"
    why: >-
      The format oracle for the synthetic generator: the test that matters is
      whether the reader the pipeline will actually use can open what we wrote.
  - name: remodnav
    constraint: "==1.1.2"
    why: >-
      The test-time ORACLE tests/eye/detect/test_nystrom_holmqvist_
      validation.py::test_remodnav_finds_a_comparable_number_of_saccades
      checks this package's own Nystrom-Holmqvist reimplementation against
      (design spec 2026-09-05-nystrom-holmqvist-design.md section 5). MIT
      and on PyPI, unlike Otero-Millan's and BMD's own MATLAB references,
      which carry no licence and cannot fill this role -- pyproject.toml's
      dev extra only, same bucket as spikeinterface above, never a runtime
      dependency and never shipped. PyPI's own release metadata listed 0.1,
      0.2, 0.3, 0.4, 1.0, 1.1, 1.1.1 and 1.1.2 on 2026-09-06.

      Since 2026-09-26 it is also REMoDNaV's own oracle, in three test
      modules (design spec 2026-09-26-remodnav-design.md section 5):
      - tests/eye/detect/test_remodnav_fidelity.py requires this package's
        REMoDNaV to label every sample exactly as remodnav does, given
        remodnav's own preprocessed signals;
      - tests/eye/detect/test_remodnav_validation.py compares the two end
        to end, on the reference recording and against the Andersson et
        al. (2017) human coders;
      - tests/eye/detect/test_remodnav.py also calls EyegazeClassifier's
        private _detect_saccades and _fix_or_pursuit, its
        get_adaptive_saccade_velocity_velthresh, and the module-level
        find_peaks, find_movement_onsetidx and find_movement_offsetidx.

      All of it was written against the installed 1.1.2.

      Pinned ==1.1.2 because three things depend on that exact release:
      - the tests call its private _detect_saccades and _fix_or_pursuit and
        require exact equality with them;
      - test_remodnav_validation.py's EXPECTED_ORACLE_FAILURES depends on
        1.1.2's preproc crashing on exactly one diagnosed file, with that
        exact message;
      - the reproduction of the paper's Table 3 is certified for 1.1.2
        only.
      Every clf.py line cited in eye/detect/remodnav.py and its tests is a
      1.1.2 line as well. CI resolves the dev extra fresh, so under a range
      a new upstream release would turn an unrelated PR red rather than
      surface here. Changing the oracle's version is therefore a deliberate
      re-validation, not a dependency bump: rerun the fidelity check and
      both gated validations, and re-read every clf.py citation.

      The pin does not protect against numpy removing np.core. clf.py:915
      calls np.core.records.fromarrays, which numpy already deprecates, so
      a numpy release that removes it breaks the oracle even under this pin.

      *Until 2026-09-27 the constraint was >=1.1 with no ceiling, and this
      said whether to pin 1.1.2 was an open decision; true when written.*

      *Until 2026-09-26 this said no ceiling was needed because the one
      test using remodnav tolerates disagreement and calls only the
      classifier's constructor, preproc() and __call__(); true when
      written.*
  - name: zarr
    constraint: ">=2,<3"
    why: >-
      The archive is a Zarr store (2026-08-27-archival-and-compression-design
      section 1); archive/store.py calls the 2.x create_dataset(...,
      compressor=...) API directly at store.py:99 and :116-117, verified by
      reading that file, so the upper bound is load-bearing rather than
      precautionary. Not currently a fix for anything broken -- spikeinterface
      already declares zarr<3,>=2.18 as a hard dependency, confirmed against
      installed distribution metadata, so a clean install already resolves
      2.18.x without this entry. Declared anyway because the dependency is
      this package's own: store.py and verify.py import zarr directly, and
      today it arrives only because spikeinterface happens to require it. If
      spikeinterface ever drops or relaxes that pin, this repository would
      break with nothing on record saying it needed zarr at all, and wlo
      stack would build a workstation missing software this package uses.
  - name: nslr
    pinned_at: 67d03f8c4a922a5a7cad9f8378caf8ba8161ee45
    why: >-
      Test-time only, AGPL-3.0, test-only by the requester's decision of
      2026-09-27. Pinned at gitlab.com/nslr/nslr commit
      67d03f8c4a922a5a7cad9f8378caf8ba8161ee45 (pinned_at repeats it, but
      wlo stack does not read that key). tests/eye/detect/_nslr_reference.py
      loads nslr/slow_nslr.py by path from the checkout
      .github/workflows/ci.yml fetches at that commit; never installed as a
      package. The GitLab package's C++ does not build with current
      compilers and it has no pure-Python fallback; PyPI's nslr 0.0.5 has a
      root-intercept defect (design spec 2026-09-27-nslr-design.md section
      2, section 7).
  - name: nslr-hmm
    pinned_at: 3598fee3c5def6734ef6c085e44356fedafaf727
    why: >-
      Test-time only, AGPL-3.0, test-only by the requester's decision of
      2026-09-27. Pinned at gitlab.com/nslr/nslr-hmm commit
      3598fee3c5def6734ef6c085e44356fedafaf727 (pinned_at repeats it, but
      wlo stack does not read that key). tests/eye/detect/_nslr_reference.py
      loads nslr_hmm.py by path from the checkout .github/workflows/ci.yml
      fetches at that commit; never installed as a package. Same reasoning
      as nslr above (design spec 2026-09-27-nslr-design.md section 2,
      section 7): its
      companion, the GitLab nslr package's C++, does not build with current
      compilers and has no pure-Python fallback, and PyPI's nslr 0.0.5 has a
      root-intercept defect.
  - name: bmd
    pinned_at: 1fab6355e57d6a7410c743ca2790d3efd502981a
    why: >-
      Test-time only. The repository has no licence file; the requester
      stated on 2026-09-27 that its authors permit its use for testing.
      Pinned at github.com/basvanopheusden/BMD commit
      1fab6355e57d6a7410c743ca2790d3efd502981a (pinned_at repeats it, but
      wlo stack does not read that key). tests/eye/detect/_bmd_reference.py
      reads the authors' stored example and table by path from the checkout
      .github/workflows/ci.yml fetches at that commit, and builds bmd.cpp,
      patched by pattern, with clang against libc++ and the Boost headers,
      which CI installs. Never installed as a package; nothing of it is
      committed. libc++ because the stored example's random stream is
      libc++'s (design spec 2026-09-27-bmd-design.md sections 2 and 7).
  - name: numcodecs
    constraint: ">=0.10,<0.16"
    why: >-
      The Blosc/zstd codec archive/store.py compresses the archive with, via
      numcodecs.Blosc. Originally declared here as an unbounded >=0.15 --
      wrong on both ends, caught in review: the floor was invented rather
      than checked, and the two dependencies that already require numcodecs
      both cap it well below that. Confirmed against installed distribution
      metadata: zarr 2.18.7 (already declared above) itself requires
      numcodecs!=0.14.0,!=0.14.1,<0.16,>=0.10.0, and spikeinterface
      separately requires numcodecs<0.16.0. An unbounded floor here
      understated a real, already-enforced ceiling, which is exactly what
      this file exists to get right for wlo stack. >=0.10,<0.16 brackets
      both dependents' real constraints rather than restating zarr's own
      oddly-specific point exclusions, which this repository has no
      independent reason to assert.
  - name: probeinterface
    constraint: ">=0.3,<0.4"
    why: >-
      Electrode geometry by part number, from its bundled OFFLINE table
      (build_neuropixels_probe; get_probe is an online lookup and never
      used), since Phase 2a; and since the probes design (2026-09-30) the
      probes stage maps each SpikeGLX run's imroTbl onto sites with its
      read_spikeglx. A runtime dependency in pyproject.toml that this file
      never declared. Below 0.4 because the site mapping was verified on
      0.3.2 (NP1000 banks 0 and 1, NP1032 bank 2) and its errors on a bad
      .meta measured there; a new minor may renumber contacts.
  - name: pynwb
    constraint: ">=4.1,<5"
    why: >-
      NWB export (docs/superpowers/specs/2026-09-28-nwb-builder-design.md):
      wl_preproc/nwb/ writes every file through it. It was already installed,
      but only because element-animal declares pynwb>=1.4.0; this package now
      imports it directly, so the dependency is declared as its own. 4.x is
      the floor because the builder writes NWB schema 2.10 files; CI resolves
      4.2.
  - name: nwbinspector
    constraint: ">=0.7,<0.8"
    why: >-
      Validates every NWB file the builder writes (parent spec section 8.1:
      "validated with nwbinspector before publication"); a CRITICAL finding
      marks the file invalid. Pinned to 0.7 because its critical checks were
      measured against these files on 2026-09-28 -- a subject with no age or
      date of birth, and a future session start -- and a new minor may add
      or regrade checks.
  - name: uneye
    pinned_at: f97ca885dd6786cbb2ee8a564e42d781f5f453b9
    why: >-
      U'n'Eye's saccade-detection network (Bellet et al. 2019), the one
      detector copied rather than reimplemented: a trained network's weights
      cannot be rewritten from a paper (saccade-detection design spec section
      8). Copied from github.com/berenslab/uneye at commit
      f97ca885dd6786cbb2ee8a564e42d781f5f453b9, upstream's last (pinned_at
      repeats it, but wlo stack does not read that key), to
      wl_preproc/eye/vendor/uneye/ with one import line changed; its
      PROVENANCE.md records what and why. Never installed as a package. It
      has no licence; this repository is private and the copy is never
      redistributed.
  # U'n'Eye's libraries, in pyproject.toml's uneye extra (design spec
  # 2026-10-06-uneye-design.md section 4). No `where`, unlike kilosort: the
  # test suite runs U'n'Eye, so the workstations it is built on need them as
  # much as the server does. None reaches a rig, which this package neither
  # runs nor builds on.
  - name: torch
    why: >-
      U'n'Eye's network runs on it, on the CPU, wherever the detection stage
      or the test suite runs. In pyproject.toml's uneye extra, not a core
      dependency: the build must come from the right index (cu126 on the
      server, whose Pascal GPU kilosort also needs; the CPU index elsewhere),
      and a plain resolve picks one that cannot run there. Unpinned: measured
      on torch 2.13 and 2.14 only, so a floor would be invented.
  - name: scikit-image
    why: >-
      U'n'Eye's copied code finds saccade runs with skimage.measure.label.
      Unpinned, as torch.
  - name: scikit-learn
    why: >-
      U'n'Eye's copied code imports sklearn.metrics at module level, for
      training and test scores this pipeline never asks for. It arrived only
      through kilosort before.
  - name: matplotlib
    why: >-
      U'n'Eye's copied classifier imports matplotlib.pyplot at module level,
      though this pipeline draws nothing with it. It arrived only through
      remodnav and kilosort before.

# The only place this edge is written down where another repository can see it.
# The dependency itself lives in pyproject.toml, which nothing outside this
# repo reads; wl-sync had no way to learn that changing its log format breaks
# something here.
requires:
  - name: wl-sync
    pinned_at: 90b931e8d4714a0b199510d5ccb8813114bb076e
    for: session identity, the barcode codec, and the log format
    why: >-
      The sync box owns everything it produces, and vendoring copies here would
      create a second definition free to drift from the one the hardware
      actually implements. A commit pin, not a branch, because the exposure is
      wired into a CI gate rather than a test: `wlpp schemas export` re-exports
      SyncBoxLogHeader from wl-sync into docs/schemas, and CI diffs that
      directory. On a moving ref, a commit to wl-sync main would change this
      repository's exported contract with nobody here touching it. The
      dependency runs one way only — wl-sync must never import from wl-preproc,
      and CI asserts it.

publishes:
  - name: session-manifest
    kind: json-schema
    at: docs/schemas/session_manifest.json
    stability: stable
    what: >-
      One record per recording session: session_id, rig, the systems expected
      to contribute, when it started and from which source, and the
      acquisition build it ran under.

  - name: job-request
    kind: json-schema
    at: docs/schemas/job_request.json
    stability: stable
    what: >-
      A unit of work handed to the pipeline: domain, selection, parameters and
      an idempotency key. A published contract wl.works builds against, and
      its Phase 18b tests run against a fake wl-preproc that honours it.

  - name: health-response
    kind: json-schema
    at: docs/schemas/health_response.json
    stability: stable
    what: >-
      Served at the health check URL wl.works polls: a verdict, readings, and
      the host's own action list — so, in its own words, "adding a sixth job
      type needs no change on the wl.works side".

  - name: behavior-camera-sidecar
    kind: json-schema
    at: docs/schemas/behavior_camera_sidecar.json
    stability: stable
    what: >-
      Per-video metadata written beside behaviour recordings: frame count and
      rate, dropped frame ids, trigger source and digital line. A published
      contract the separate FLIR camera project builds against.

  - name: done-marker
    kind: json-schema
    at: docs/schemas/done_marker.json
    stability: stable
    what: >-
      Written when a system finishes transferring: the files it produced, the
      system that wrote them, and when the transfer finished.

  - name: syncbox-log-header
    kind: json-schema
    at: docs/schemas/syncbox_log_header.json
    stability: stable
    mirrors: wl-sync
    what: >-
      Re-exported from wl-sync, not redefined — wl-sync owns session identity
      and the log format. Kept identical by the CI step that re-runs
      `wlpp schemas export` and diffs docs/schemas.

  - name: event-code-protocol
    kind: python-model
    at: wl_preproc/contracts/events.py
    stability: stable
    what: >-
      The 16-bit strobed event code protocol: framing, escapes, checksum,
      payload word counts and DVA (degrees-of-visual-angle) encoding.
      wl-xcon emits against this protocol; this repository only
      decodes it. Previously the most load-bearing cross-repo contract in
      the recording path with no entry here at all — unaskable through
      `wlo`, absent from `wlo dependents`, and a change to it would notify
      nobody.

  - name: nwb-session
    kind: nwb
    stability: planned
    available_after: ingest
    what: >-
      LFP, multiunit, Kilosort output, eye tracking and task codes aligned onto
      one clock. The target layout is Phase 3 and not settled; nothing should
      be built against its structure yet.

# The artifacts this package builds on. These are the three the `requires` entry
# above names in prose — written here as the artifact names wl-sync owns, so the
# registry can join them rather than read them out of a sentence.
consumes:
  - name: syncbox-log-header
    why: >-
      Re-exported into docs/schemas and diffed by CI, so the sync box's log
      format and this repository's published contract cannot drift apart.
  - name: session-id
    why: >-
      Every session this pipeline ingests is keyed by the identity the sync box
      minted for it.
  - name: barcode-codec
    why: >-
      Alignment onto one clock is decoded from the barcodes the sync box emits.
  - name: task-event-vocabulary
    why: >-
      TaskEvent 256-4095 is ALLOCATED in wl-xtasks and decoded here. Agreed
      2026-09-01, answering the clause wl-xcon's ADR-0007 left pending
      on this repository: ownership splits on decodability versus meaning, and a
      wrong task-event number makes a recording uninterpretable rather than
      undecodable. The four values this repository already allocated
      (TaskEvent 256-259) transfer as already-allocated -- ownership moving is
      not permission to renumber, and renumbering would silently relabel every
      event in every prior recording.

      The enum still lives in wl_preproc/contracts/events.py because wl-xtasks
      publishes this artifact as `stability: planned` and defines no TaskEvent
      in code, so ours is the only implementation and this pipeline must decode
      those values today. It is a MIRROR of wl-xtasks' allocation, not the
      source of truth, on the same reasoning wl-xcon mirrors
      PAYLOAD_WORD_COUNTS rather than importing it. New task events are
      requested there and never added here. When wl-xtasks ships a package this
      becomes a `requires` edge with a commit pin, the way wl-sync already is.
