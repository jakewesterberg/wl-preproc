[project]
name = "wl-preproc"
version = "0.1.0"
description = "Automated post-session preprocessing pipeline for NHP systems neuroscience"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # wl-sync is not on PyPI. A direct reference is deliberate: the sync box owns
    # session identity, the barcode codec and the log format, and vendoring copies
    # of them here would create a second definition free to drift from the one the
    # hardware actually implements.
    #
    # A COMMIT PIN, not a branch, for the reason the Elements below are pinned --
    # and here the exposure is wired directly into a CI gate rather than a test:
    # `wlpp schemas export` re-exports SyncBoxLogHeader from wl-sync into
    # docs/schemas (wl_preproc/cli/main.py), and CI's "Exported schemas are
    # current" step re-runs that export and `git diff --exit-code`s the
    # directory. On a moving ref, a commit to wl-sync main changes this repo's
    # published contract -- or reds CI on an unrelated PR -- with no change in
    # this repo at all. Resolved 2026-08-14 with `git ls-remote <url> main`.
    "wl-sync @ git+https://github.com/jakewesterberg/wl-sync.git@90b931e8d4714a0b199510d5ccb8813114bb076e",  # main
    "datajoint>=2.3,<3",
    # `wl_preproc/eye/ohdpi.py` imports pandas directly, for `read_ohdpi`'s
    # column-selective CSV reads. It already arrives unconditionally with
    # `datajoint` above -- a hard, non-extra requirement, confirmed against
    # installed distribution metadata -- so a clean install already resolves
    # some pandas without this line. Declared anyway for the same reason as
    # `zarr` below: `wlo stack` reads `third_party` from every package's own
    # manifest alone, and an import this package makes directly needs to be on
    # record here.
    #
    # The floor is a decision, not a formality. Task 1 closed `OhdpiRecording`
    # against in-place mutation with an explicit `frames.setflags(write=
    # False)` in `read_ohdpi`. Under the installed pandas 3.0.5 that call is
    # already redundant: `to_numpy()` returns a read-only array by
    # construction, because pandas >= 3.0 makes copy-on-write mandatory --
    # confirmed directly here, not assumed: `pandas.Series([1]).to_numpy().
    # flags.writeable` is `False`, and asking pandas to disable CoW raises
    # `Pandas4Warning: Copy-on-Write can no longer be disabled`. A `>=3` floor
    # would make that guard, and the test asserting it
    # (tests/eye/test_ohdpi_reader.py::test_the_arrays_reject_in_place_mutation,
    # which already documents this exact ambiguity), permanently unable to
    # fail -- dead code with a test that can only ever pass. `>=2` keeps a
    # pandas 2.x resolution valid, where `to_numpy()` returns a writeable
    # array by default and the explicit call is what actually protects the
    # frozen dataclass from a silent in-place mutation.
    #
    # No ceiling, for the same reason zarr's and numcodecs' bounds are not
    # invented: `datajoint` requires bare `pandas`, unconstrained, and
    # `spikeinterface` caps `pandas<3` only under its `full`/`metrics`/`docs`
    # extras, none of which this project installs -- both confirmed against
    # installed distribution metadata. Nothing here forces `<3`, and 3.0.5 is
    # what is actually installed and tested against.
    "pandas>=2",
    # The Elements are mid-migration to DataJoint 2.x and no fork is taken.
    # element-animal pins to the open PR that does its migration, which is zero
    # divergence by construction; the other three already activate cleanly on
    # 2.3 in the specific sense of .activate(db_name) — that is NOT a claim
    # that they need no compatibility handling. element_session raises
    # AttributeError on a bare import without wl_preproc.schema._compat's
    # shim; element_event's event and trial submodules do too once imported
    # directly (bare `import element_event` alone does not trigger it). See
    # that module's docstring. element-array-ephys is deliberately absent —
    # its issue #230 is unfixed and its tables silently destroy array data
    # under 2.x. See spec section 5.1.1 and the Phase 2 precondition recorded
    # there.
    #
    # COMMIT PINS, not branches, as the 1c-1 design spec section 2 requires.
    # Resolved 2026-08-14 with `git ls-remote <url> <ref>`; the branch each SHA
    # came from is kept beside it so the next bump is a one-line re-resolve.
    # Branches were live refs here until then, and that is not theoretical: the
    # blob allow-list in tests/schema/test_guardrails.py is keyed to four
    # fully-qualified attribute names in specific upstream revisions, so an
    # upstream commit could change that guard's verdict with no change in this
    # repo -- and element-animal tracks a PERSONAL FORK's branch following an
    # open PR (element-animal #51), which disappears the day that PR merges and
    # the branch is deleted, taking `pip install -e .` with it. Re-resolve
    # deliberately, and re-run the suite when you do.
    "element-lab @ git+https://github.com/datajoint/element-lab.git@830e1a85790f89bd7221c09f69b704c7185eef7a",  # main
    "element-animal @ git+https://github.com/akshay-jaggi/element-animal.git@0d1ae2463785f19fb74f4a4b4e3710a294153e51",  # compat-fixes
    "element-session @ git+https://github.com/datajoint/element-session.git@fed82e43a8e49ea9b36ee3b812bea64b36552356",  # main
    "element-event @ git+https://github.com/datajoint/element-event.git@e2cf2874a073ee19dcfd020e5904443c91b78c8c",  # main
    # blake3 rather than hashlib.blake2b: spec section 4.6's behaviour-camera
    # sidecar is a frozen interface that already specifies `checksum: <blake3>`,
    # so the algorithm was committed to before ingest existed. Measured
    # 2026-08-15 at 1.83 GB/s vs blake2b's 1.15 GB/s; a 360 GB session verifies
    # in ~3.3 min. Wheels published for cp311 and cp313, which is what CI runs.
    "blake3>=1.0,<2",
    # Electrode geometry, and deliberately a PyPI version pin rather than a
    # sixth git pin -- section 11's "five git dependency pins do not move"
    # holds. This repository already treats ProbeInterface as the geometry
    # authority: wl_preproc/synth/spikeglx.py:100 records that the SpikeGLX
    # reader looks probe geometry up by part number in ProbeInterface's table
    # and raises if it is absent. It is also already installed, as a transitive
    # dependency of the spikeinterface format oracle in the dev extra.
    #
    # Its OFFLINE table is the one used -- build_neuropixels_probe(), backed by
    # the bundled neuropixels_probes JSON. probeinterface.get_probe() is an
    # ONLINE lookup against the probeinterface library repository and must
    # never enter this path; it 404s without network access.
    "probeinterface>=0.3,<0.4",
    # The archive is a Zarr store (2026-08-27-archival-and-compression-design
    # section 1). Upper-bounded below 3 because `archive/store.py` calls the
    # 2.x `create_dataset(..., compressor=...)` API directly (store.py:99 and
    # :116-117 -- verified by reading that file, not inferred). Zarr 3.x is
    # not installed anywhere in this environment, so this repository cannot
    # itself confirm what changed there; the bound exists so an eventual
    # upgrade is a deliberate migration of those two call sites rather than a
    # silent break, not because a specific 3.x replacement is known here.
    #
    # Not currently a fix for anything broken: `spikeinterface` already
    # declares `zarr<3,>=2.18` as a hard (non-extra) dependency -- confirmed
    # against this venv's installed distribution metadata directly, not
    # inferred -- so a clean install already resolves zarr 2.18.x and the <3
    # bound is already enforced without this line. It is declared anyway
    # because the dependency is this package's OWN: `store.py` and
    # `verify.py` import `zarr` directly, and today it arrives only because
    # spikeinterface happens to require it. If spikeinterface ever drops or
    # relaxes that pin, this repository would break with nothing on record
    # saying it ever needed zarr at all -- and `wlo stack` would build a
    # workstation missing software this package uses.
    "zarr>=2,<3",
    # Blosc/zstd, the codec `archive/store.py` compresses the archive with
    # via `numcodecs.Blosc(cname=..., clevel=..., shuffle=numcodecs.Blosc.
    # NOSHUFFLE)`. WavPack would compress ~6% better but wraps a system
    # library that will not install from pip -- see that design's section
    # 2.1.
    #
    # Originally declared here as `>=0.15` with no verified floor for that
    # call signature and no upper bound at all -- both wrong, caught in
    # review: `>=0.15` was invented, not checked, and the two dependencies
    # that already require numcodecs both cap it well below that. Confirmed
    # against installed distribution metadata: zarr 2.18.7 (already pinned
    # above) itself requires `numcodecs!=0.14.0,!=0.14.1,<0.16,>=0.10.0`,
    # and spikeinterface separately requires `numcodecs<0.16.0`. So an
    # unbounded `>=0.15` understated a real, already-enforced ceiling, and
    # `wlo stack` reading this file alone would have no way to know
    # numcodecs 0.16 cannot resolve on a clean install here. `>=0.10,<0.16`
    # brackets both dependents' real constraints rather than restating
    # zarr's own oddly-specific point exclusions (0.14.0/0.14.1), which this
    # repository has no independent reason to assert. The Blosc call
    # signature `store.py` uses is not independently verified against a
    # specific numcodecs release -- this floor is deliberately no tighter
    # than what the dependencies that already require numcodecs enforce.
    "numcodecs>=0.10,<0.16",
]

# No upper Python bound. An earlier draft pinned <3.12, justified as the
# Kilosort4/PyTorch requirement for Pascal — that was wrong and is recorded in
# spec section 6.6. The Pascal constraint is the *wheel index*: PyTorch must
# come from cu126, which is the last index shipping sm_61 kernels. cu126 itself
# ships wheels for cp39 through cp315, so Python was never constrained by it.
#
# PyTorch is deliberately NOT a dependency here. Installing it correctly means
# pointing at the cu126 index explicitly, since PyPI's default moved to CUDA 13
# at PyTorch 2.11 and CUDA 13 dropped Pascal entirely. That belongs in the
# per-stage container image (spec section 6.6.1), not in a requirements list
# where a plain resolve would silently produce a build that cannot run.

[project.optional-dependencies]
# SpikeInterface is the format oracle for the synthetic generator: the test
# that matters is whether the reader the pipeline will actually use can open
# what we wrote. Guessing at .meta or .rhs fields does not survive contact with
# it. This holds for both emitters — read_spikeglx and read_intan each open
# their own emitted session in tests/synth/, and Intan is checked past merely
# opening: the amplifier stream is reshaped correctly and the Stim stream's gain
# is the stim step size the header declares.
# remodnav is the test-time ORACLE `tests/eye/detect/test_nystrom_holmqvist_
# validation.py::test_remodnav_finds_a_comparable_number_of_saccades` checks
# this repository's own Nystrom-Holmqvist reimplementation against (design
# spec `2026-09-05-nystrom-holmqvist-design.md` section 5; parent
# `2026-08-31-saccade-detection-design.md` section 3.2: "a development
# dependency used to check our output, never a runtime dependency and never
# shipped"). It is MIT-licensed and on PyPI -- unlike Otero-Millan's and
# BMD's own MATLAB references, which carry no licence and cannot fill this
# role -- so it needs no vendoring and no credential.
#
# `>=1.1` floors at the first 1.x release; confirmed against PyPI's own
# release metadata (0.1, 0.2, 0.3, 0.4, 1.0, 1.1, 1.1.1, 1.1.2 as of
# 2026-09-06) rather than assumed. No ceiling: this repository calls only
# `remodnav.EyegazeClassifier`'s constructor, `.preproc()` and `.__call__()`,
# all present since at least 1.1, and the test that uses it tolerates
# disagreement by design (it is an oracle, not a specification), so a future
# 1.x or 2.x release changing its own thresholds is not this repository's
# concern to pin against pre-emptively.
dev = [
    "pytest>=8.0",
    "spikeinterface>=0.101",
    "testcontainers[mysql]>=4.15,<5",
    "remodnav>=1.1",
]

[project.scripts]
wlpp = "wl_preproc.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wl_preproc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test suite imports shared helpers across test files
# (tests.schema.test_guardrails), which requires the repository root on sys.path.
# python -m pytest adds the working directory to sys.path; the bare pytest
# console script does not. CI uses both (line 50: bare pytest, line 65: python -m
# pytest), so this setting ensures both work correctly. This is pytest's
# supported configuration for this case, and preferable to adding __init__.py
# files to tests/ (which this repository deliberately does not have).
pythonpath = ["."]
# tests/conftest.py is the root conftest, so it imports datajoint at
# collection time for every test in the suite, not only the schema tests.
# datajoint itself raises two warnings on import/first-config-read that this
# project has no control over. Each entry below matches the exact message
# (as a startswith-regex, per Python's warnings module) and the exact module
# that raises it — not category alone — so an unrelated DeprecationWarning or
# UserWarning from anywhere else in the suite still surfaces.
filterwarnings = [
    "ignore:datajoint.migrate is deprecated and is scheduled for removal in DataJoint 2.4 or 2.5. Complete your schema migrations while on DataJoint 2.3 or earlier.:DeprecationWarning:datajoint$",
    "ignore:No datajoint.json found. Using defaults and environment variables. Run :UserWarning:datajoint\\.settings$",
]
# Registered so pytest does not warn "unknown marker" and so `--markers` states
# in one place what it means. `slow` is for a test that runs a real sorter --
# spec section 7's tests/ephys/test_kilosort_defaults_split_units.py, minutes
# not seconds on CPU -- rather than anything about the rest of this fast suite.
# `real_scratch` is unrelated to `slow` and not excluded by the `addopts`
# below: it opts one test out of tests/conftest.py's autouse scratch-headroom
# mock (see that fixture's own docstring) so it can check `watcher.
# scratch_headroom` is genuinely `doctor.scratch_headroom`, not a same-named
# local reimplementation -- an identity check, not a real-disk one, so it
# costs nothing to run everywhere the rest of the suite does.
markers = [
    "slow: runs a real sorter; excluded from CI, run by hand",
    "real_scratch: opts one test out of the autouse scratch-headroom mock",
]
# Deselects `slow` by default. CI runs bare `pytest -v` and, separately,
# `python -m pytest tests/schema/test_guardrails.py -v` (.github/workflows/ci.yml
# and the Guardrails step) -- neither passes `-m`, so both rely on this default
# to keep a real KS4 sort out of CI. Run the slow test by hand with
# `pytest -m slow`: pytest appends `addopts` ahead of the real command line, and
# an explicit `-m` there replaces the ini's rather than ANDing with it, so
# `-m slow` on the command line overrides this `not slow`, not narrows it further.
addopts = "-m 'not slow'"
